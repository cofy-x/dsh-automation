name: Release Check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to verify
        required: true
        type: string
      version:
        description: Expected coordinated package version
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-check-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release identity
        env:
          EXPECTED_REF: ${{ inputs.ref }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            node scripts/release/check.mjs --tag "$GITHUB_REF_NAME" --require-annotated-tag
          else
            [[ "$EXPECTED_REF" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$EXPECTED_REF"
            test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
            node scripts/release/check.mjs
          fi
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Run complete release gate
        run: pnpm run release:check
