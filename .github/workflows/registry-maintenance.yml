name: registry maintenance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published release version whose dist-tags should be reconciled
        required: true
        type: string

permissions:
  contents: read

jobs:
  dist-tags:
    name: reconcile npm dist-tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Reconcile release dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/tags.mjs --version "$RELEASE_VERSION"
